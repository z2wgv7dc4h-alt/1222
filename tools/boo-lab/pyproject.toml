[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boo-lab"
version = "0.1.0"
description = "Section lab + gated riff extract for metal FLACs. Not a writer."
requires-python = ">=3.10"
dependencies = ["librosa>=0.11.0", "soundfile>=0.12.0"]

# NOTE: pyproject cannot express a pip `-c constraints.txt`; the CUDA torch
# pin lives in constraints.txt and must be passed on the command line, e.g.
#   python -m pip install -c constraints.txt -e ".[intern,pitch,align]"
# (setup.bat does this). Installing an extra without `-c` can let the resolver
# swap in the PyPI `torch==2.8.0+cpu` wheel and silently drop CUDA.
[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Default vocal-melody pitch tracker (CREPE via torchcrepe); vocal_melody
# falls back to librosa.pyin when this isn't installed.
pitch = ["torchcrepe"]
# Plain-lyric timing via WhisperX forced alignment (lyrics.align_whisperx);
# Lyrics still works without it, showing plain lyrics untimed.
align = ["whisperx"]
# JAMS 0.3 validation (jams_export writes the shape itself; this is optional).
jams = ["jams"]
# Local studio UI (http://127.0.0.1:8765). Thin pip install -e . is pin/Save
# core only; opening the studio needs this extra. guitarpro covers GP5 paths.
studio = ["fastapi", "uvicorn", "python-multipart", "guitarpro"]
# Optional research "interns" -- never default dependencies. `natten` is
# required by allin1's Dinat model; `_natten_compat` restores the pre-0.17 API
# it expects so the new natten works on CPU/Windows. `madmom` is a real runtime
# import of allin1 (`allin1/spectrogram.py`) that allin1's own package metadata
# does NOT declare -- without it here a fresh `.[intern]` install leaves
# `import allin1` failing with ModuleNotFoundError: madmom. (Its sdist builds
# fine under pip's default build isolation on py3.12 -- verified -- so no
# --no-build-isolation is needed.)
intern = ["allin1", "beat-this", "natten", "jams", "mir_eval", "madmom"]

[project.scripts]
boo-lab = "boo_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
