[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "god-tier-metal"
version = "0.1.0"
description = "Local engine that writes djent / tech-death / slam"
dependencies = ["mido>=1.3.0", "librosa>=1.0.0", "soundfile>=0.12.0"]

[project.scripts]
god-tier-metal = "engine.__main__:main"